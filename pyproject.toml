[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent"
version = "0.1.0"
description = "Deterministic hardware-semantic simulation sandbox and agent harness"
authors = [{ name = "Harness Agent Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "fastapi @ git+https://github.com/fastapi/fastapi.git@9d34ad0ee8a0dfbbcce06f76c2d5d851085024fc",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
